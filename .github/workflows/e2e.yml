name: End-to-End Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL }}
      DATABASE_CONNECTION_MODE: direct
      AUTH_SECRET: playwright-e2e-ci-only-secret-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Prepare E2E database
        run: npm run db:prepare:e2e

      - name: Run production build
        env:
          DATABASE_URL: '${{ secrets.PLAYWRIGHT_DATABASE_URL }}&connection_limit=3&connect_timeout=30&pool_timeout=60'
          E2E_BUILD: 'true'
        shell: bash
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/next-build.log"
          transient_db_pattern="P1001|Can't reach database server|Error opening a TLS connection.*unexpected EOF"

          for attempt in 1 2 3; do
            if npm run build 2>&1 | tee "$build_log"; then
              rm -f "$build_log"
              exit 0
            fi

            if ! grep -Eqi "$transient_db_pattern" "$build_log"; then
              rm -f "$build_log"
              echo "::error::Production build failed with a non-transient error."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              rm -f "$build_log"
              echo "::error::Production build still cannot connect reliably to the E2E database after retries."
              exit 1
            fi

            echo "::warning::Production build hit a transient E2E database/TLS connection error. Retrying in 10 seconds. (attempt $attempt/3)"
            sleep 10
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
